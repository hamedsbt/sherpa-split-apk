name: Build ttsEngine V2.9

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            name: arm7
          - abi: arm64-v8a
            name: arm8

    steps:
      # 1. Clone V2.9
      - name: Clone ttsEngine V2.9
        uses: actions/checkout@v4
        with:
          repository: woheller69/ttsEngine
          ref: V2.9
          fetch-depth: 1

      # 2. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Make Gradle executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Build only the selected ABI
      - name: Build ${{ matrix.name }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.build.abi=${{ matrix.abi }}

      # 5. Find generated APK
      - name: List build output
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      # 6. Rename APK
      - name: Rename APK
        run: |
          mkdir -p artifacts

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          cp "$APK" "artifacts/ttsEngine-V2.9-${{ matrix.name }}.apk"

      # 7. Upload APK
      - name: Upload ${{ matrix.name }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ttsEngine-V2.9-${{ matrix.name }}
          path: artifacts/ttsEngine-V2.9-${{ matrix.name }}.apk
