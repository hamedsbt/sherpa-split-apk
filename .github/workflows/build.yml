
name: Build ttsEngine V2.9

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            name: arm7
          - abi: arm64-v8a
            name: arm8

    steps:
      - name: Clone ttsEngine V2.9
        uses: actions/checkout@v4
        with:
          repository: woheller69/ttsEngine
          ref: V2.9
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Add the ABI filter to the upstream project.
      # This makes the APK contain ONLY the requested ABI.
      - name: Configure ABI
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          abi = os.environ["ABI"]

          # Add ndk { abiFilters += "$ABI" } inside defaultConfig.
          if 'abiFilters' not in text:
              pattern = r'(defaultConfig\s*\{)'
              replacement = (
                  r'\1\n'
                  f'        ndk {{ abiFilters += "{abi}" }}'
              )

              new_text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count != 1:
                  print("Could not find defaultConfig in app/build.gradle.kts")
                  print(text)
                  raise SystemExit(1)

              path.write_text(new_text)

          print("Configured ABI:", abi)
          print(path.read_text())
          PY

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Show generated files
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

          echo "=== Build outputs ==="
          find app/build/outputs -type f -print || true

      - name: Collect APK
        env:
          ABI: ${{ matrix.abi }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p artifacts

          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo
            echo "Complete output tree:"
            find app/build -type f | sort
            exit 1
          fi

          echo "Found APK: $APK"

          cp "$APK" "artifacts/ttsEngine-V2.9-${NAME}.apk"

          echo
          echo "Final artifact:"
          ls -lh "artifacts/ttsEngine-V2.9-${NAME}.apk"

      - name: Upload ${{ matrix.name }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ttsEngine-V2.9-${{ matrix.name }}
          path: artifacts/ttsEngine-V2.9-${{ matrix.name }}.apk
