
name: Build ttsEngine V2.9

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM7 and ARM8
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Clone the V2.9 tag
      # ------------------------------------------------------------
      - name: Checkout ttsEngine V2.9
        uses: actions/checkout@v4
        with:
          repository: woheller69/ttsEngine
          ref: V2.9
          fetch-depth: 1

      # ------------------------------------------------------------
      # Java 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # Configure ABI splits
      #
      # V2.9 already contains ndk abiFilters.
      # Remove those filters because AGP rejects having both
      # ndk.abiFilters and splits.abi filters simultaneously.
      # ------------------------------------------------------------
      - name: Configure ABI splits
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          # Remove ndk { ... } blocks that contain abiFilters.
          pattern = re.compile(
              r'(?ms)^[ \t]*ndk\s*\{.*?abiFilters.*?^[ \t]*\}\s*'
          )

          text, removed = pattern.subn("", text)

          print(f"Removed {removed} existing ndk/abiFilters block(s).")

          # Make sure there is no remaining abiFilters declaration.
          if "abiFilters" in text:
              raise SystemExit(
                  "ERROR: abiFilters still exists in app/build.gradle.kts"
              )

          # Find android {
          android_start = text.find("android {")

          if android_start < 0:
              raise SystemExit(
                  "ERROR: android { block not found"
              )

          # Find the matching closing brace for android {
          open_brace = text.find("{", android_start)

          depth = 0
          close_brace = None

          for i in range(open_brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      close_brace = i
                      break

          if close_brace is None:
              raise SystemExit(
                  "ERROR: Could not find end of android { block"
              )

          # Add ABI splits INSIDE android { ... }
          abi_split = """
          
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("armeabi-v7a", "arm64-v8a")
                      isUniversalApk = false
                  }
              }
          """

          text = (
              text[:close_brace]
              + abi_split
              + text[close_brace:]
          )

          path.write_text(text)

          print()
          print("===== FINAL app/build.gradle.kts =====")
          print(text)

      # ------------------------------------------------------------
      # Verify Gradle configuration before starting the build
      # ------------------------------------------------------------
      - name: Verify Gradle configuration
        run: |
          echo "===== ABI split configuration ====="

          grep -n -A8 -B3 "splits" app/build.gradle.kts

          echo
          echo "===== Checking for abiFilters ====="

          if grep -n "abiFilters" app/build.gradle.kts; then
            echo "ERROR: abiFilters is still present."
            exit 1
          fi

          echo "Configuration OK."

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build release APKs
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      # ------------------------------------------------------------
      # Show everything Gradle generated
      # ------------------------------------------------------------
      - name: List generated APKs
        run: |
          echo "===== Generated APKs ====="

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------------------
      # Prepare artifacts
      # ------------------------------------------------------------
      - name: Prepare ARM7 APK
        run: |
          set -e

          mkdir -p artifacts

          ARM7=$(find app/build/outputs \
            -type f \
            -name "*armeabi-v7a*.apk" \
            | head -n 1)

          if [ -z "$ARM7" ]; then
            echo "ERROR: ARM7 APK was not found."
            exit 1
          fi

          echo "ARM7: $ARM7"

          cp "$ARM7" \
            artifacts/ttsEngine-V2.9-arm7.apk

      - name: Prepare ARM8 APK
        run: |
          set -e

          ARM8=$(find app/build/outputs \
            -type f \
            -name "*arm64-v8a*.apk" \
            | head -n 1)

          if [ -z "$ARM8" ]; then
            echo "ERROR: ARM8 APK was not found."
            exit 1
          fi

          echo "ARM8: $ARM8"

          cp "$ARM8" \
            artifacts/ttsEngine-V2.9-arm8.apk

      # ------------------------------------------------------------
      # Verify native libraries
      # ------------------------------------------------------------
      - name: Verify APK ABIs
        run: |
          set -e

          ARM7="artifacts/ttsEngine-V2.9-arm7.apk"
          ARM8="artifacts/ttsEngine-V2.9-arm8.apk"

          echo "========================================"
          echo "ARM7 native libraries"
          echo "========================================"

          unzip -l "$ARM7" | grep '/lib/' || true

          echo
          echo "========================================"
          echo "ARM8 native libraries"
          echo "========================================"

          unzip -l "$ARM8" | grep '/lib/' || true

          echo
          echo "========================================"
          echo "Checking ARM7"
          echo "========================================"

          if unzip -l "$ARM7" | grep -q 'lib/arm64-v8a/'; then
            echo "ERROR: ARM7 contains arm64-v8a!"
            exit 1
          fi

          if ! unzip -l "$ARM7" | grep -q 'lib/armeabi-v7a/'; then
            echo "ERROR: ARM7 contains no armeabi-v7a!"
            exit 1
          fi

          echo "ARM7 PASSED"

          echo
          echo "========================================"
          echo "Checking ARM8"
          echo "========================================"

          if unzip -l "$ARM8" | grep -q 'lib/armeabi-v7a/'; then
            echo "ERROR: ARM8 contains armeabi-v7a!"
            exit 1
          fi

          if ! unzip -l "$ARM8" | grep -q 'lib/arm64-v8a/'; then
            echo "ERROR: ARM8 contains no arm64-v8a!"
            exit 1
          fi

          echo "ARM8 PASSED"

          echo
          echo "ABI verification PASSED."

      # ------------------------------------------------------------
      # Show final sizes
      # ------------------------------------------------------------
      - name: Show final APK sizes
        run: |
          echo "===== Final APKs ====="
          ls -lh artifacts/

      # ------------------------------------------------------------
      # Upload ARM7
      # ------------------------------------------------------------
      - name: Upload ARM7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ttsEngine-V2.9-arm7
          path: artifacts/ttsEngine-V2.9-arm7.apk

      # ------------------------------------------------------------
      # Upload ARM8
      # ------------------------------------------------------------
      - name: Upload ARM8 APK
        uses: actions/upload-artifact@v4
        with:
          name: ttsEngine-V2.9-arm8
          path: artifacts/ttsEngine-V2.9-arm8.apk
