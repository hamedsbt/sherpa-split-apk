name: Build ttsEngine V2.9

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM7 + ARM8
    runs-on: ubuntu-latest

    steps:
      - name: Clone ttsEngine V2.9
        uses: actions/checkout@v4
        with:
          repository: woheller69/ttsEngine
          ref: V2.9
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Configure Gradle to generate ONLY:
      #   armeabi-v7a
      #   arm64-v8a
      #
      # No universal APK.

      - name: Configure ABI splits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          if "isUniversalApk" in text:
              print("ABI splits already configured")
              print(text)
              raise SystemExit(0)

          # Find the android { block.
          android_start = text.find("android {")

          if android_start == -1:
              raise SystemExit("ERROR: android { block not found")

          # Find the matching closing brace for android {.
          brace_start = text.find("{", android_start)

          depth = 0
          android_end = None

          for i in range(brace_start, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      android_end = i
                      break

          if android_end is None:
              raise SystemExit("ERROR: Could not find end of android { block")

          abi_splits = '''
          
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("armeabi-v7a", "arm64-v8a")
                      isUniversalApk = false
                  }
              }
          '''

          text = (
              text[:android_end]
              + abi_splits
              + text[android_end:]
          )

          path.write_text(text)

          print("===== Modified app/build.gradle.kts =====")
          print(text)
          PY

      - name: Build release APKs
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Show APK contents
        run: |
          echo "===== APK files ====="
          find app/build/outputs -type f -name "*.apk" -print

          echo
          echo "===== APK native libraries ====="

          for apk in $(find app/build/outputs -type f -name "*.apk"); do
            echo
            echo "----------------------------------------"
            echo "$apk"
            echo "----------------------------------------"
            unzip -l "$apk" | grep '/lib/' || true
          done

      - name: Collect ARM7 APK
        run: |
          mkdir -p artifacts

          ARM7=$(find app/build/outputs -type f -name "*armeabi-v7a*.apk" | head -n 1)

          if [ -z "$ARM7" ]; then
            echo "ERROR: ARM7 APK not found"
            exit 1
          fi

          cp "$ARM7" artifacts/ttsEngine-V2.9-arm7.apk

      - name: Collect ARM8 APK
        run: |
          ARM8=$(find app/build/outputs -type f -name "*arm64-v8a*.apk" | head -n 1)

          if [ -z "$ARM8" ]; then
            echo "ERROR: ARM8 APK not found"
            exit 1
          fi

          cp "$ARM8" artifacts/ttsEngine-V2.9-arm8.apk

      # Verify that ARM7 contains no ARM8 libraries.
      - name: Verify ARM7 APK
        run: |
          echo "===== ARM7 ====="
          unzip -l artifacts/ttsEngine-V2.9-arm7.apk | grep '/lib/' || true

          if unzip -l artifacts/ttsEngine-V2.9-arm7.apk | grep -q 'lib/arm64-v8a/'; then
            echo "ERROR: ARM7 APK contains arm64-v8a libraries"
            exit 1
          fi

      # Verify that ARM8 contains no ARM7 libraries.
      - name: Verify ARM8 APK
        run: |
          echo "===== ARM8 ====="
          unzip -l artifacts/ttsEngine-V2.9-arm8.apk | grep '/lib/' || true

          if unzip -l artifacts/ttsEngine-V2.9-arm8.apk | grep -q 'lib/armeabi-v7a/'; then
            echo "ERROR: ARM8 APK contains armeabi-v7a libraries"
            exit 1
          fi

      - name: Show final APK sizes
        run: |
          echo "===== Final APKs ====="
          ls -lh artifacts/

      - name: Upload ARM7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ttsEngine-V2.9-arm7
          path: artifacts/ttsEngine-V2.9-arm7.apk

      - name: Upload ARM8 APK
        uses: actions/upload-artifact@v4
        with:
          name: ttsEngine-V2.9-arm8
          path: artifacts/ttsEngine-V2.9-arm8.apk
