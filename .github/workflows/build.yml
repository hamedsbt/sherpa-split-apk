name: Build ttsEngine V2.9

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM7 + ARM8
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Clone V2.9
      # ------------------------------------------------------------
      - name: Clone ttsEngine V2.9
        uses: actions/checkout@v4
        with:
          repository: woheller69/ttsEngine
          ref: V2.9
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Java
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # 3. Configure ABI splits
      #
      # IMPORTANT:
      # V2.9 already has ndk.abiFilters.
      #
      # We remove that configuration because AGP does not allow
      # ndk abiFilters and splits.abi filters to be configured
      # simultaneously for the same ABIs.
      # ------------------------------------------------------------
      - name: Configure ABI splits
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          print("===== ORIGINAL build.gradle.kts =====")
          print(text)

          # ----------------------------------------------------------
          # Remove an existing:
          #
          # ndk {
          #     abiFilters += listOf(...)
          # }
          #
          # block from defaultConfig.
          #
          # This is intentionally limited to an ndk block containing
          # abiFilters so that unrelated Gradle configuration is not
          # removed.
          # ----------------------------------------------------------

          pattern = re.compile(
              r'''
              (?P<indent>^[ \t]*)ndk\s*\{\s*
              (?:
                  (?!\n[ \t]*\})
                  .
              )*?
              abiFilters\s*(?:\+=|=)\s*
              [^\n]+
              \s*
              \}
              ''',
              re.MULTILINE | re.VERBOSE
          )

          new_text, count = pattern.subn("", text)

          print(f"Removed existing ndk/abiFilters blocks: {count}")

          text = new_text

          # ----------------------------------------------------------
          # Locate android { ... } safely by matching braces.
          # ----------------------------------------------------------

          android_start = text.find("android {")

          if android_start == -1:
              raise SystemExit("ERROR: android { block not found")

          brace_start = text.find("{", android_start)

          depth = 0
          android_end = None

          for i in range(brace_start, len(text)):
              char = text[i]

              if char == "{":
                  depth += 1

              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      android_end = i
                      break

          if android_end is None:
              raise SystemExit(
                  "ERROR: Could not find closing brace of android block"
              )

          # ----------------------------------------------------------
          # Add ABI splits INSIDE android { ... }.
          # ----------------------------------------------------------

          abi_split = '''
          
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("armeabi-v7a", "arm64-v8a")
                      isUniversalApk = false
                  }
              }
          '''

          text = (
              text[:android_end]
              + abi_split
              + text[android_end:]
          )

          path.write_text(text)

          print()
          print("===== FINAL build.gradle.kts =====")
          print(text)
          PY

      # ------------------------------------------------------------
      # 4. Verify configuration BEFORE building
      # ------------------------------------------------------------
      - name: Verify ABI configuration
        run: |
          echo "===== ABI configuration ====="

          grep -n -A10 -B3 "splits" app/build.gradle.kts || true

          echo
          echo "===== Checking for ndk abiFilters ====="

          if grep -n "abiFilters" app/build.gradle.kts; then
            echo "ERROR: ndk abiFilters is still present."
            echo "It conflicts with splits.abi in this project."
            exit 1
          fi

          echo "OK: no ndk abiFilters remain."

      # ------------------------------------------------------------
      # 5. Build both APKs
      # ------------------------------------------------------------
      - name: Build release APKs
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      # ------------------------------------------------------------
      # 6. Find generated APKs
      # ------------------------------------------------------------
      - name: Find APKs
        run: |
          echo "===== Generated APK files ====="

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------------------
      # 7. Collect ARM7
      # ------------------------------------------------------------
      - name: Collect ARM7 APK
        run: |
          mkdir -p artifacts

          ARM7=$(find app/build/outputs \
            -type f \
            -name "*armeabi-v7a*.apk" \
            | head -n 1)

          if [ -z "$ARM7" ]; then
            echo "ERROR: ARM7 APK was not generated."
            find app/build/outputs -type f -print
            exit 1
          fi

          echo "ARM7 APK: $ARM7"

          cp "$ARM7" \
            artifacts/ttsEngine-V2.9-arm7.apk

      # ------------------------------------------------------------
      # 8. Collect ARM8
      # ------------------------------------------------------------
      - name: Collect ARM8 APK
        run: |
          ARM8=$(find app/build/outputs \
            -type f \
            -name "*arm64-v8a*.apk" \
            | head -n 1)

          if [ -z "$ARM8" ]; then
            echo "ERROR: ARM8 APK was not generated."
            find app/build/outputs -type f -print
            exit 1
          fi

          echo "ARM8 APK: $ARM8"

          cp "$ARM8" \
            artifacts/ttsEngine-V2.9-arm8.apk

      # ------------------------------------------------------------
      # 9. Inspect native libraries
      # ------------------------------------------------------------
      - name: Inspect APK ABIs
        run: |
          set -e

          echo "========================================"
          echo "ARM7 APK"
          echo "========================================"

          unzip -l artifacts/ttsEngine-V2.9-arm7.apk \
            | grep '/lib/' || true

          echo
          echo "========================================"
          echo "ARM8 APK"
          echo "========================================"

          unzip -l artifacts/ttsEngine-V2.9-arm8.apk \
            | grep '/lib/' || true

      # ------------------------------------------------------------
      # 10. HARD verification
      #
      # ARM7 must NOT contain arm64-v8a.
      # ARM8 must NOT contain armeabi-v7a.
      # ------------------------------------------------------------
      - name: Verify APK contents
        run: |
          set -e

          ARM7="artifacts/ttsEngine-V2.9-arm7.apk"
          ARM8="artifacts/ttsEngine-V2.9-arm8.apk"

          echo "Checking ARM7..."

          if unzip -l "$ARM7" | grep -q "lib/arm64-v8a/"; then
            echo "ERROR: ARM7 APK contains arm64-v8a libraries!"
            exit 1
          fi

          if ! unzip -l "$ARM7" | grep -q "lib/armeabi-v7a/"; then
            echo "ERROR: ARM7 APK contains no armeabi-v7a libraries!"
            exit 1
          fi

          echo "ARM7 OK."

          echo
          echo "Checking ARM8..."

          if unzip -l "$ARM8" | grep -q "lib/armeabi-v7a/"; then
            echo "ERROR: ARM8 APK contains armeabi-v7a libraries!"
            exit 1
          fi

          if ! unzip -l "$ARM8" | grep -q "lib/arm64-v8a/"; then
            echo "ERROR: ARM8 APK contains no arm64-v8a libraries!"
            exit 1
          fi

          echo "ARM8 OK."

          echo
          echo "ABI verification PASSED."

      # ------------------------------------------------------------
      # 11. Show final sizes
      # ------------------------------------------------------------
      - name: Show final APK sizes
        run: |
          echo "===== Final APKs ====="
          ls -lh artifacts/

      # ------------------------------------------------------------
      # 12. Upload ARM7
      # ------------------------------------------------------------
      - name: Upload ARM7
        uses: actions/upload-artifact@v4
        with:
          name: ttsEngine-V2.9-arm7
          path: artifacts/ttsEngine-V2.9-arm7.apk

      # ------------------------------------------------------------
      # 13. Upload ARM8
      # ------------------------------------------------------------
      - name: Upload ARM8
      - name: Upload ARM8
        uses: actions/upload-artifact@v4
        with:
          name: ttsEngine-V2.9-arm8
          path: artifacts/ttsEngine-V2.9-arm8.apk
